[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "root-teller"
version = "0.2.0"
description = "Progressive microservice root-cause analysis via a cross-window memory graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "torch>=2.5",
]

[project.optional-dependencies]
logs = ["sentence-transformers>=3.0"]
plot = ["pillow>=10.0"]
test = ["pytest>=8.0"]
baselines = ["requests>=2.31", "networkx>=3.0", "gensim>=4.3", "scipy>=1.10", "scikit-learn>=1.3", "sentence-transformers>=3.0"]
system = ["fastapi>=0.116", "uvicorn>=0.35", "python-multipart>=0.0.20"]

[project.scripts]
root-teller = "root_teller.integration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"root_teller.module3.structured" = ["feedback_schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "system/tests"]
